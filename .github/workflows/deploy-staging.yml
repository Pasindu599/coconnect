name: Deploy to staging

# On every push to main (main only moves through merged, CI-green PRs):
#   1. database migrations  -> the staging Supabase project
#   2. Edge Functions       -> the staging Supabase project
#   3. the static site      -> Vercel
# See .claude/docs/runbooks/staging-deploy.md for the one-time setup (secrets
# and variables) this needs before it can succeed.
on:
  push:
    branches: [main]

concurrency: deploy-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Apply database migrations
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}

      - name: Deploy Edge Functions
        run: npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      # Vercel builds with the env vars set in the Vercel project
      # (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_AUTH_MODE, VITE_GOOGLE_MAPS_API_KEY).
      - name: Deploy site to Vercel
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
