# Supabase CLI config (replaces firebase.json). Only the settings Coconnect
# depends on are listed; everything else uses the CLI defaults.
# Hosted project: `npx supabase link --project-ref <ref>`, then
# `npx supabase db push` and `npx supabase functions deploy`.
project_id = "coconnect"

[auth]
site_url = "http://localhost:3000"
# Google OAuth (WorkspaceHub) returns to the hash route it started from.
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.sms]
enable_signup = true
enable_confirmations = true

# Local stack only: phone OTP without an SMS provider. The hosted project
# needs a real provider (Twilio, MessageBird, Vonage or Textlocal) set in the
# dashboard, or test numbers under Auth > Providers > Phone.
[auth.sms.test_otp]
94771234567 = "123456"
94719876543 = "123456"
94772223344 = "123456"
94773334455 = "123456"

[functions.create-payment]
verify_jwt = true

# PayHere calls this directly; it authenticates by md5sig, not a JWT.
[functions.payhere-notify]
verify_jwt = false
