    <script>
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = nativeFetch;
          
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = typeof fn === 'function' ? fn : nativeFetch;
            },
            configurable: true,
            enumerable: true
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = typeof fn === 'function' ? fn : nativeFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (eProto) {}
          }
        } catch (e) {
          console.warn('Window.fetch property initialization fallback applied:', e);
        }
      })();
